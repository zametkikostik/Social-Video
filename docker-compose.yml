version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: socialvideo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: socialvideo
      POSTGRES_PASSWORD: socialvideo
      POSTGRES_DB: socialvideo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialvideo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: socialvideo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Local S3-compatible storage (MinIO) — для разработки.
  # В продакшене используем Cloudflare R2.
  minio:
    image: minio/minio:latest
    container_name: socialvideo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Создаём bucket при старте
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/social-video --ignore-existing;
      mc anonymous set download local/social-video;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
